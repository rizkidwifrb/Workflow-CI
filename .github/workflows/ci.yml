name: MLOps CI
on:
  push:
    branches: [main]
jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'
      - run: pip install mlflow pandas scikit-learn
      - name: Run mlflow project
        working-directory: MLProject
        run: mlflow run. --env-manager=local
      - name: Build Docker
        working-directory: MLProject
        run: docker build -t rizkidwifrb/workflow-ci:latest.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: rizkidwifrb
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push Docker
        run: docker push rizkidwifrb/workflow-ci:latest
      - name: Upload mlruns as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlruns
          path: MLProject/mlruns
