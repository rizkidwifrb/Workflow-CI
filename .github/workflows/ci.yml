name: MLflow-CI
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  train:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    - run: pip install mlflow
    - name: Run MLflow Project
      run: cd MLProject && mlflow run .
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mlruns
        path: MLProject/mlruns/
    - name: Build Docker
      run: |
        RUN_ID=$(ls -td MLProject/mlruns/0/*/ | head -1 | cut -d'/' -f4)
        mlflow models build-docker -m "MLProject/mlruns/0/$RUN_ID/artifacts/model" -n uwiberani/workflow-ci:latest
    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.uwiberani }}
        password: ${{ secrets.dckr_pat_401aRlihJnTf_smTsa1kWswV33c }}
    - run: docker push uwiberani/workflow-ci:latest
