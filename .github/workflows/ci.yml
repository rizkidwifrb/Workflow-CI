name: MLflow-CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: pip install mlflow pandas scikit-learn

      - name: Run MLflow Project
        working-directory: MLProject
        run: mlflow run . --env-manager=local

      - name: Build Docker (custom)
        working-directory: MLProject
        run: docker build -t uwiberani/workflow-ci:latest .

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.uwiberani }}
          password: ${{ secrets.dckr_pat_401aRlihJnTf_smTsa1kWswV33c }}

      - name: Push Docker Image
        run: docker push uwiberani/workflow-ci:latest
